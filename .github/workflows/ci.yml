# Continuous integration (Node.js only): lint, then the whole Vitest suite (ui + server) against
#   (1) the docker-compose stack (MySQL 8.0 + Neo4j 5.26), exactly as the README's Docker path, and
#   (2) MariaDB 11.4 (the other supported database), without Neo4j (those tests skip themselves).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Type check (tsc --noEmit)
        run: npm run lint
      - name: Workflow files are valid (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: docker-compose.yml is valid
        run: docker compose config --quiet
      - name: Shell scripts parse
        run: bash -n docker/mysql/00_app_user.sh docker/mysql/07_role_accounts.sh

  test-docker-compose:
    name: tests + build (MySQL 8.0 + Neo4j 5, docker compose, Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Create .env for the Docker stack
        run: |
          cp .env.example .env
          sed -i 's/^MYSQL_PORT=.*/MYSQL_PORT=3307/' .env
      - name: Start MySQL and Neo4j
        run: docker compose up -d --wait
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Generate the timetable
        run: npm run generate -- --replace
      - name: Export to Neo4j
        run: npm run etl
      - name: Run every documented Cypher query
        run: npm run queries -- demo
      - name: Tests (Vitest, ui + server)
        run: npm test
      - name: Production build
        run: npm run build
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

  test-mariadb:
    name: tests (MariaDB 11.4, Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: timetable
      MYSQL_PASSWORD: ci_password
      MYSQL_DATABASE: university_timetable
      # role accounts for the API routes (sql/06_auth_roles.sql + docker/mysql/07_role_accounts.sh)
      MYSQL_ADMIN_USER: tt_admin_app
      MYSQL_ADMIN_PASSWORD: ci_admin_password
      MYSQL_FACULTY_USER: tt_faculty_app
      MYSQL_FACULTY_PASSWORD: ci_faculty_password
      APP_SECRET: ci-only-session-signing-secret
      # no NEO4J_* settings and no Neo4j server: the Neo4j tests skip themselves
    steps:
      - uses: actions/checkout@v5
      - name: Load the SQL files with the server's own client (they use DELIMITER)
        run: |
          db="${{ job.services.mariadb.id }}"
          for f in sql/01_schema.sql sql/02_migration_improvements.sql sql/03_seed_data.sql \
                   sql/04_views_procedures.sql sql/05_advanced_sql.sql sql/06_auth_roles.sql; do
            echo "loading $f"
            docker exec -i "$db" mariadb -uroot -proot < "$f"
          done
      - name: Create the service account and the two role accounts (as docker/mysql/07_role_accounts.sh)
        run: |
          docker exec -i "${{ job.services.mariadb.id }}" mariadb -uroot -proot <<SQL
          CREATE USER '$MYSQL_USER'@'%' IDENTIFIED BY '$MYSQL_PASSWORD';
          GRANT ALL PRIVILEGES ON university_timetable.* TO '$MYSQL_USER'@'%';
          CREATE USER '$MYSQL_ADMIN_USER'@'%' IDENTIFIED BY '$MYSQL_ADMIN_PASSWORD';
          CREATE USER '$MYSQL_FACULTY_USER'@'%' IDENTIFIED BY '$MYSQL_FACULTY_PASSWORD';
          GRANT tt_admin TO '$MYSQL_ADMIN_USER'@'%';
          GRANT tt_faculty TO '$MYSQL_FACULTY_USER'@'%';
          FLUSH PRIVILEGES;
          SQL
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Generate the timetable
        run: npm run generate -- --replace
      - name: "Tests (Neo4j tests skip: no Neo4j in this job)"
        run: npm test
